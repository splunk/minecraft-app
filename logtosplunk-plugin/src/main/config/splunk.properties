# =============================================================================
# LogToSplunk plugin/mod configuration
# =============================================================================
# How to use: copy this file to <server-dir>/config/splunk.properties (the plugin/mod reads
# it from `<server working dir>/config/splunk.properties` at startup -- NOT from inside the
# jar). Replace every CHANGEME value below, then restart the server.
#
# Two independent Splunk connections are configured here:
#   1. HTTP Event Collector (HEC)   -- `splunk.craft.connection.*` / `splunk.craft.token`.
#      All the per-event logging below (block/death/player/combat/item/etc.) is sent here,
#      as JSON, sourcetype `minecraft:json`. The index it lands in is whatever index the HEC
#      token itself is bound to on the Splunk side (Settings -> Data Inputs -> HTTP Event
#      Collector) -- there is no `index=` key in this file.
#   2. KV-store REST endpoint (splunkd management port) -- `splunk.craft.kvstore.*`, used only
#      by the player-stats scraper. Different host/port/credential than HEC; see the comment
#      block above `splunk.craft.enable.playerstats` below for why.
# =============================================================================

# --- HTTP Event Collector (HEC) connection ---
# Splunk host that accepts HEC requests (the splunkd HEC listener, default port 8088, HTTP).
splunk.craft.connection.host=127.0.0.1
# HEC port. 8088 is the Splunk default; confirm against Settings -> Data Inputs -> HTTP Event
# Collector -> Global Settings if you've customized it.
splunk.craft.connection.port=8088
# HEC token (a UUID) from Settings -> Data Inputs -> HTTP Event Collector -> <your token>.
# This determines which index/sourcetype-defaults events land under -- NOT a KV-store credential.
splunk.craft.token=CHANGEME-1234-5678-1234-123456789012
# If true, every event sent to Splunk is also echoed to the server console/log file.
# Useful for debugging; safe to leave on, since it's just a duplicate of what already went to HEC.
splunk.craft.enable.consolelog=true

# --- Extended logging categories (all opt-in; default off) ---
# Combat & survival: damage, kills, healing, hunger, respawn (throttled per player)
splunk.craft.enable.combat=false
# Item economy: pickup, drop
splunk.craft.enable.item=false
# Progression: xp, level, enchant, craft, fish, command
splunk.craft.enable.progression=false
# Server lifecycle: start, weather change
splunk.craft.enable.server=false
# Performance sampler: online players, loaded chunks (TPS/MSPT require Paper API)
splunk.craft.enable.performance=false
# How often (in server ticks, 20 ticks = 1s) to sample performance
splunk.craft.performance.interval_ticks=600
# Session detail: log client IP on connect (PII -- opt in deliberately)
splunk.craft.enable.session_ip=false
# Session detail: teleport, gamemode change, bed enter, world change
splunk.craft.enable.session_detail=false

# --- Player stats scraper -> KV store (snapshot data, NOT sent via HEC) ---
# Reads <world>/players/stats/<uuid>.json + advancements/<uuid>.json and upserts one doc per
# player into a Splunk KV-store collection. Uses the splunkd MANAGEMENT REST endpoint, which
# is a different host/port and credential than HEC -- HEC cannot write a KV store.
splunk.craft.enable.playerstats=false
# How often (in server ticks, 20 ticks = 1s) to scrape; 6000 = ~5 min
splunk.craft.playerstats.interval_ticks=6000
# splunkd management interface (NOT the HEC port). Default mgmt port is 8089, HTTPS.
splunk.craft.kvstore.host=127.0.0.1
splunk.craft.kvstore.port=8089
# App namespace (app DIRECTORY name under etc/apps) that owns the collection. The
# SplunkCraft app ships collections.conf + transforms.conf for minecraft_player_stats.
splunk.craft.kvstore.app=SplunkCraft
# KV-store collection name (must match collections.conf)
splunk.craft.kvstore.collection=minecraft_player_stats
# Splunk bearer/JWT token with write access (Settings -> Tokens). NOT the HEC token.
splunk.craft.kvstore.bearer_token=CHANGEME
# Optional: world directory name or absolute path (default: world)
#splunk.craft.world.path=world